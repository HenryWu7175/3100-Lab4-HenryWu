server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index-lab2.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index-lab2.php?$query_string;
    }

    # Pass PHP scripts to the PHP-FPM container
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-processor:9000;
        fastcgi_index index-lab2.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}