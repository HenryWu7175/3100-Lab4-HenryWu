#version: '3.8'

services:

  web-server:
    image: nginx:latest
    container_name: lab_nginx
    ports:
      - "80:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    image: php:8.2-fpm
    container_name: lab_php
    environment:
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - ./www:/var/www/html
    depends_on:
      - database
    restart: always
    command: >
      sh -c "docker-php-ext-install mysqli pdo pdo_mysql && php-fpm"
  database:
    image: mysql:8.0
    container_name: lab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    #ports:
    #  - "3307:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
