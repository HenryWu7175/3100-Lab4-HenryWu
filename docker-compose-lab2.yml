version: '3.8'

services:

  # 1. Web Server Service (Nginx)
  web-server:
    image: nginx:latest
    container_name: lab_nginx
    ports:
      - "8080:80"
    volumes:
      - ./www:/usr/share/nginx/html
      - ./nginx_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    depends_on:
      - php-processor

  # 2. PHP Processor Service
  php-processor:
    image: php:8.2-fpm
    container_name: lab_php
    volumes:
      - ./www:/usr/share/nginx/html
    restart: always

    # Custom installation script ensures PHP can speak to MySQL
    command: >
      sh -c "docker-php-ext-install pdo pdo_mysql mysqli && php-fpm"

  # 3. Database Service (MySQL)
  database:
    image: mysql:8.0
    container_name: lab_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always